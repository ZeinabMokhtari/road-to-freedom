<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Road to Freedom</title><style>*{box-sizing:border-box}body{margin:0;background:#25251e;color:#fff4db;font-family:Georgia}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}header{padding:24px 4%;background:linear-gradient(#151a17dd,transparent);display:flex;justify-content:space-between}h1{margin:4px 0;font-size:clamp(28px,5vw,56px)}small{font:12px Arial;letter-spacing:3px;text-transform:uppercase}button{background:#30483a;color:#fff4db;border:1px solid #d5c395;padding:12px 18px;border-radius:4px;cursor:pointer;font:bold 15px Arial}button:disabled{opacity:.4}#sign{position:absolute;right:8%;top:40%;background:#345442;border:5px double #f3e2b7;box-shadow:5px 8px 12px #0005;font: bold clamp(18px,3vw,32px) Georgia;max-width:35%;transform:rotate(-2deg)}footer{position:fixed;bottom:0;width:100%;padding:20px 4%;background:#17231de8;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#markers{display:flex;gap:5px;flex:1}#markers button{padding:8px;flex:1}dialog{background:#f3e7cb;color:#292b22;border:2px solid #a68b59;width:min(760px,92vw);padding:30px;border-radius:8px}dialog::backdrop{background:#10171188}h2{font-size:clamp(30px,5vw,50px);margin:10px 0}#story{font-size:clamp(20px,3vw,30px);line-height:1.4}#context{font:17px/1.5 Arial;border-left:4px solid #a88b54;padding-left:14px}#quote{font-style:italic}#nav{display:flex;justify-content:space-between;gap:10px}a{color:#36543e}#caption{font:12px Arial;color:#ddd0ae}</style><canvas id="scene"></canvas><header><div><small>Mississippi · A historical reconstruction</small><h1>The Road to Freedom</h1><div>Fannie Lou Hamer’s journey for voting rights</div></div><div><button id="full">Full screen</button></div></header><button id="sign">Begin journey →</button><footer><span id="status">Ready to travel</span><div id="markers"></div><button id="back">←</button><button id="go">Drive →</button><span id="caption">Illustrated simulation · not archival footage</span></footer><dialog id="panel"><small id="date"></small><h2 id="heading"></h2><p id="story"></p><p id="context"></p><p id="quote"></p><div id="media"></div><p style="font:12px Arial">First-person educational reconstruction, not verbatim testimony.</p><div id="nav"><button id="close">Return to road</button><button id="next">Continue journey →</button></div></dialog><script>const data=[
['Biography','1917 · Mississippi','I was born on October 6, 1917, into a poor family of sharecroppers. I grew up working in cotton fields and received a sixth-grade education.','Fannie Lou Hamer’s early life was shaped by poverty and racial inequality.','Does anyone recognize this quote? “I’m sick and tired of being sick and tired.”',12,77],
['Sharecropping','Growing up in the Delta','I worked in the cotton fields. Because I could read and write, I later became a timekeeper.','Sharecroppers farmed land owned by someone else in exchange for a share of the crop. Many remained trapped in poverty.','',30,65],
['Bob Moses','1962 · A turning point','After church, I learned about a meeting on voting rights. I decided to attend. It changed the direction of my life.','Bob Moses was a civil rights organizer who helped Black Mississippians pursue voter registration.','',46,86],
['Literacy Test','1962 · The first barrier','I tried to register to vote, but I did not pass the literacy test. My landowner demanded that I withdraw my attempt to register. I refused and lost my job.','Literacy tests were used to prevent Black citizens from exercising their voting rights.','',70,69],
['January 1963','1963 · Persistence','I tried again. In January 1963, I finally passed the literacy test. I believed I had the right to be heard.','Passing the test was a milestone, not the end of discrimination or intimidation.','',88,47],
['Civil Rights Movement','1963 · Courage under pressure','I helped other Black people register to vote. I was arrested and severely beaten in jail. But I was not going to let fear silence me.','Her activism continued despite threats and violence.','',65,47],
['MFDP','1964 · Organizing together','We helped create the Mississippi Freedom Democratic Party because the regular state Democratic Party excluded Black people.','MFDP stands for Mississippi Freedom Democratic Party. It challenged racial exclusion in political representation.','',43,33],
['1964','Atlantic City · Democratic National Convention','I stood before the Credentials Committee and told America about the injustice, threats and violence we faced simply because we wanted to vote.','The MFDP challenged Mississippi’s all-white delegation at the national convention.','I wanted America to hear the truth.',12,22],
['Voting Rights Act','1965 · A historic milestone','Our struggle helped build pressure for change. The Voting Rights Act became law in 1965.','President Lyndon B. Johnson signed the law, which prohibited discriminatory voting practices. Hamer was one of many activists who helped make this change possible.','Never be afraid to speak up for what is right. Your voice matters.',67,15]
];
const $=x=>document.getElementById(x),c=$('scene'),g=c.getContext('2d');let pos=0,target=-1,current=-1,start=0,driving=false,seen=new Set(),phase=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function poly(points,color){g.fillStyle=color;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function draw(t){let w=c.width=innerWidth,h=c.height=innerHeight,hor=h*.43;let sky=g.createLinearGradient(0,0,0,hor);sky.addColorStop(0,'#84999a');sky.addColorStop(1,'#e7cda0');g.fillStyle=sky;g.fillRect(0,0,w,h);g.fillStyle='#d8bd83';g.fillRect(0,hor,w,h-hor);for(let k=0;k<35;k++){let x=k*w/34;g.fillStyle=k%2?'#68734e':'#596647';g.beginPath();g.ellipse(x,hor-7,40,12+10*Math.sin(k*3)**2,0,0,7);g.fill()}let bend=z=>Math.sin(pos*.9+z*2.7)*w*.23*z;let center=z=>w/2+bend(z);let edge=z=>w*(.012+.48*z*z);for(let j=0;j<100;j++){let z=j/100,q=(j+1)/100,y=hor+(h-hor)*z,Y=hor+(h-hor)*q;let a=center(z),b=center(q),e=edge(z),f=edge(q);let stripe=Math.floor(18/(z+.08)+pos*8)%2;poly([[0,y],[w,y],[w,Y],[0,Y]],stripe?'#a28d58':'#ad985f');poly([[a-e-12*z,y],[a+e+12*z,y],[b+f+12*q,Y],[b-f-12*q,Y]],'#c7b28b');poly([[a-e,y],[a+e,y],[b+f,Y],[b-f,Y]],current<1?'#8c785d':'#595950');if(stripe&&current>=1)poly([[a-2*z,y],[a+2*z,y],[b+2*q,Y],[b-2*q,Y]],'#e4d5aa')}
for(let k=0;k<32;k++){let z=((k/32+pos*.12)%1);let y=hor+(h-hor)*z*z,sz=5+z*z*65;for(let side of [-1,1]){let x=center(z*z)+side*(edge(z*z)+sz*1.4);if(current<3||current===4){for(let m=0;m<5;m++){let xx=x+side*m*sz*.65;g.strokeStyle='#5e6940';g.lineWidth=2;g.beginPath();g.moveTo(xx,y);g.lineTo(xx,y-sz*.45);g.stroke();g.fillStyle='#eee5ce';g.beginPath();g.arc(xx,y-sz*.45,sz*.13,0,7);g.fill()}}else if(k%5===0){g.fillStyle='#c4b18c';g.fillRect(x-sz,y-sz,sz*1.8,sz);poly([[x-sz*1.2,y-sz],[x,y-sz*1.6],[x+sz,y-sz]],'#725445');g.fillStyle='#423f34';g.fillRect(x-sz*.15,y-sz*.6,sz*.35,sz*.6)}}}let v=g.createRadialGradient(w/2,h/2,h*.15,w/2,h/2,w*.65);v.addColorStop(0,'transparent');v.addColorStop(1,'#30271b66');g.fillStyle=v;g.fillRect(0,0,w,h);if(driving){let f=Math.min(1,(t-start)/(reduced?30:2200));pos=phase+(target+1-phase)*(f*f*(3-2*f));if(f===1){driving=false;arrive(target)}}requestAnimationFrame(draw)}function travel(i){if(driving||i<0||i>8)return;$('panel').close();target=i;phase=pos;start=performance.now();driving=true;$('sign').hidden=true;$('status').textContent='Traveling to '+data[i][0]}function arrive(i){current=i;seen.add(i);let d=data[i];['heading','date','story','context','quote'].forEach((id,j)=>$(id).textContent=d[j]);$('media').innerHTML=i===7?'<a href="https://www.youtube.com/results?search_query=Fannie+Lou+Hamer+1964+testimony" target="_blank" rel="noopener">Find historical testimony (online)</a>':'';$('status').textContent=seen.size+' / 9 explored';$('sign').hidden=false;$('sign').textContent=d[0]+' · Explore';$('next').textContent=i===8?'Finish journey':'Continue journey →';$('panel').showModal()}function next(){if(current===8){$('heading').textContent='Your voice matters.';$('story').textContent='What can we do when others are denied their voice?';$('context').textContent='The struggle for equal voting rights continues.';$('quote').textContent='';$('media').textContent='';$('next').disabled=true}else travel(current+1)}data.forEach((d,i)=>{let b=document.createElement('button');b.textContent=i+1;b.title=d[0];b.onclick=()=>travel(i);$('markers').append(b)});$('sign').onclick=()=>current<0?travel(0):arrive(current);$('go').onclick=()=>travel(Math.min(8,current+1));$('back').onclick=()=>travel(Math.max(0,current-1));$('close').onclick=()=>$('panel').close();$('next').onclick=next;$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();travel(Math.max(0,current-1))}});requestAnimationFrame(draw);</script></html>
